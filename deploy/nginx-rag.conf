# Nginx 反向代理配置模板 - RAG Knowledge & FastMCP Service
# 生产部署时放入 /etc/nginx/sites-available/ 并软链到 sites-enabled/

server {
    listen 80;
    server_name rag.yourcompany.com;
    # 强制将 HTTP 重定向至 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rag.yourcompany.com;

    # SSL 证书配置 (推荐使用 Certbot Let's Encrypt 证书)
    ssl_certificate     /etc/letsencrypt/live/rag.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.yourcompany.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 1. 允许上传大型附件 (必须大于平台的单文件限制，建议 50M)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # 标准代理请求头透传
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 2. 关键！禁用反向代理缓冲，保证 FastMCP 的 SSE 流式响应不被卡顿缓冲
        proxy_buffering off;
        proxy_cache off;

        # 3. 超时时间调优，防止大型文档上传与深度解析被 504 截断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
